<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        const originalAttachShadow = Element.prototype.attachShadow;
        Element.prototype.attachShadow = function(options) {
          // Force mode to 'open' by copying options to a new mutable object
          // This avoids throwing TypeErrors if the options object is frozen by the library
          const newOptions = options ? { ...options, mode: 'open' } : { mode: 'open' };
          const shadowRoot = originalAttachShadow.call(this, newOptions);

          // Direct styles override injected inside the shadow root
          try {
            const style = document.createElement('style');
            style.textContent = `
              #logo, a[href*="spline"], [class*="logo"], [id*="logo"], [class*="watermark"] {
                display: none !important;
                opacity: 0 !important;
                visibility: hidden !important;
                pointer-events: none !important;
              }
            `;
            shadowRoot.appendChild(style);
          } catch (e) {}

          return shadowRoot;
        };

        // Recursive shadow-piercing sweeper to target watermark elements globally
        const sweepWatermarks = () => {
          const styleContent = `
            #logo, a[href*="spline"], [class*="logo"], [id*="logo"], [class*="watermark"] {
              display: none !important;
              opacity: 0 !important;
              visibility: hidden !important;
              pointer-events: none !important;
            }
          `;

          const injectStyle = (root) => {
            if (!root) return;
            if (root.querySelector && !root.querySelector('#hide-spline-style')) {
              const style = document.createElement('style');
              style.id = 'hide-spline-style';
              style.textContent = styleContent;
              root.appendChild(style);
            }
          };

          const traverse = (node) => {
            if (!node) return;

            // Traverse shadow DOMs
            if (node.shadowRoot) {
              injectStyle(node.shadowRoot);
              traverse(node.shadowRoot);
            }

            // Direct check on element
            try {
              if (node.tagName === 'A' && node.href && node.href.toLowerCase().includes('spline')) {
                node.style.display = 'none';
                node.style.opacity = '0';
                node.style.visibility = 'hidden';
                node.style.pointerEvents = 'none';
                node.remove();
              }
              if (node.id === 'logo' || (node.className && typeof node.className === 'string' && node.className.toLowerCase().includes('logo'))) {
                node.style.display = 'none';
                node.style.opacity = '0';
                node.style.visibility = 'hidden';
                node.style.pointerEvents = 'none';
                node.remove();
              }
              if (node.querySelector) {
                const logo = node.querySelector('#logo') || 
                             node.querySelector('a[href*="spline"]') || 
                             node.querySelector('[class*="logo"]') || 
                             node.querySelector('[id*="logo"]') ||
                             node.querySelector('[class*="watermark"]');
                if (logo) {
                  logo.style.display = 'none';
                  logo.style.opacity = '0';
                  logo.style.visibility = 'hidden';
                  logo.style.pointerEvents = 'none';
                  logo.remove();
                }
              }
            } catch (e) {}

            const children = node.children || node.childNodes;
            if (children) {
              for (let i = 0; i < children.length; i++) {
                traverse(children[i]);
              }
            }
          };

          traverse(document.body);
          injectStyle(document.head);
        };

        // Sweep dynamically loaded elements every 150ms
        setInterval(sweepWatermarks, 150);
      })();
    </script>
